name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go:
    name: Go build & test (${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Go version for this repo.
        # (We can add newer versions once they're available on GitHub-hosted runners.)
        go: [ '1.26.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go/go.mod
      - name: Force local toolchain
        run: echo "GOTOOLCHAIN=local" >> $GITHUB_ENV
      - name: Download modules
        working-directory: go
        run: go mod download
      - name: Format check
        working-directory: go
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; echo 'run gofmt -s -w .'; exit 1; }
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: go
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Build
        working-directory: go
        run: go build ./...

  rust:
    name: Rust build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Generate Cargo.lock
        working-directory: rust/sim
        run: cargo generate-lockfile
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sim
      - name: Format check
        working-directory: rust/sim
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust/sim
        run: cargo clippy --all-targets --features redpanda -- -D warnings
      - name: Test
        working-directory: rust/sim
        run: cargo test
      - name: Test (redpanda feature)
        working-directory: rust/sim
        run: cargo test --features redpanda
      - name: Build
        working-directory: rust/sim
        run: cargo build --release

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Enable cache when a lockfile exists.
      - run: npm install
      - run: npm run build

  contract-test:
    name: Contract tests (Schemathesis)
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v6
      - name: Start test infra
        # Retry to absorb transient Docker Hub image-pull timeouts on the runner.
        run: |
          n=0
          until docker compose -f ci/docker-compose.test.yml up -d --build --wait --wait-timeout 120; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "infra failed to start after $n attempts"; exit 1; fi
            echo "infra start attempt $n failed (likely a registry pull timeout), retrying in 15s..."
            sleep 15
          done
      - name: Wait for backends
        run: |
          for port in 8080 8081; do
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port/healthz > /dev/null 2>&1; then
                echo "Backend on :$port is ready"
                break
              fi
              sleep 2
            done
          done
      - name: Event pipeline e2e (fraud + analytics fan-out)
        run: bash scripts/e2e/transfers_e2e.sh
        env:
          BASE_URL: http://localhost:8081
          COMPOSE_FILE: ci/docker-compose.test.yml
      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f ci/docker-compose.test.yml logs --tail=200 sim-rust sim-go nats
      - name: Install Schemathesis
        # Pinned: an unpinned install drifts versions across runs (non-reproducible).
        run: pip install schemathesis==4.21.8
      # Run the per-operation conformance phases (coverage, fuzzing); the stateful
      # link-exploration phase is excluded as exploratory. --request-retries
      # tolerates the occasional transient "connection aborted" (HTTP keep-alive
      # reuse race against the shared backends under CI load), which is a transport
      # flake, not a schema violation; a real violation still fails every retry.
      - name: Test Go backend
        run: st run --checks response_schema_conformance --phases coverage,fuzzing --request-retries 3 --url http://localhost:8080 --exclude-path-regex '/v1/sim/' api/openapi.yaml
      - name: Test Rust backend
        run: st run --checks response_schema_conformance --phases coverage,fuzzing --request-retries 3 --url http://localhost:8081 --exclude-path-regex '/v1/sim/' api/openapi.yaml
      - name: Teardown
        if: always()
        run: docker compose -f ci/docker-compose.test.yml down
